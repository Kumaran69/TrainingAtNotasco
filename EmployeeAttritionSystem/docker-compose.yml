services:
  db:
    image: postgres:16-alpine
    container_name: attrition_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attrition_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attrition_backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - attrition_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attrition_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - attrition_network

volumes:
  postgres_data:

networks:
  attrition_network:
    driver: bridge
