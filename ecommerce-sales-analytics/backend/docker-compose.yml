version: "3.8"

# Local PostgreSQL for development. Run: docker compose up -d
# Matches the DATABASE_URL in .env.example. Not used in production —
# your deployment host provides its own managed Postgres instead.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_analytics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
