# Local parity testing only — mirrors what runs on Render/Railway (backend)
# and Netlify (frontend, via its own build, not this compose file) so you
# can sanity-check the containers before deploying.
#
#   docker compose up --build
#   -> API:      http://localhost:5000/api/health
#   -> Frontend: http://localhost:8080
#
# MongoDB data persists in the `mongo_data` volume across restarts.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://kumarkumaran6253_EC:Kumaran%406253@ac-eqwnwa8-shard-00-00.whzauno.mongodb.net:27017,ac-eqwnwa8-shard-00-01.whzauno.mongodb.net:27017,ac-eqwnwa8-shard-00-02.whzauno.mongodb.net:27017/?ssl=true&replicaSet=atlas-yzdvmq-shard-0&authSource=admin&appName=Cluster0

      FRONTEND_ORIGIN: "*"
      PORT: 5000
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:5000"
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
