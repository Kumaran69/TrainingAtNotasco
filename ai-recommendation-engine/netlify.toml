[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let client-side routing (if ever added) fall back to
# index.html instead of 404ing on refresh. Harmless with the current
# single-route app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
